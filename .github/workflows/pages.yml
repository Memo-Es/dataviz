name: Deploy PyConnectedness Explorer to GitHub Pages

on:
  push:
    branches: [main, claude/pensive-pascal-sz4532]
    paths:
      - "pyconnectedness-explorer/app/**"
      - "pyconnectedness-explorer/pipeline/compute.py"
      - "pyconnectedness-explorer/pipeline/insight_fixtures.py"
      - "pyconnectedness-explorer/vendor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyconnectedness-explorer/app
    steps:
      # the library itself: an uploaded file runs through it in the browser (scripts/copy-py.mjs)
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pyconnectedness-explorer/app/package-lock.json
      - run: npm ci
      # graph 1's insights: every printed number recomputed, on every dataset and on synthetic uploads
      - run: npm run check:insights
      # no network calls to Yahoo here: public/data/ is committed, the build only reads it;
      # it also copies the pinned library and pipeline/compute.py into public/py/
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pyconnectedness-explorer/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
