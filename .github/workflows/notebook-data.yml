name: Rebuild explorer data from Demo.ipynb and the public APIs

# Runs PyConnectedness's own examples/Demo.ipynb, unchanged, at the pinned submodule commit,
# against live Yahoo Finance data (the stock-market dataset), then builds the other datasets
# from their public APIs with the library's own functions (run_datasets.py), and commits the
# results. This is the only way the explorer's numbers get made: no synthetic input, no
# reimplementation.

on:
  push:
    branches: [claude/serene-shannon-v6pfgc]
    paths:
      - "pyconnectedness-explorer/pipeline/run_demo.py"
      - "pyconnectedness-explorer/pipeline/export_cell.py"
      - "pyconnectedness-explorer/pipeline/validate.py"
      - "pyconnectedness-explorer/pipeline/requirements.txt"
      - "pyconnectedness-explorer/pipeline/run_datasets.py"
      - "pyconnectedness-explorer/pipeline/datasets/**"
      - ".github/workflows/notebook-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notebook-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyconnectedness-explorer/pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the library from the pinned submodule, plus the notebook's own imports
        run: |
          pip install -r requirements.txt
          pip install --force-reinstall --no-deps ../vendor/PyConnectedness
          python -c "import pyconnectedness, sys; print(pyconnectedness.__file__)"
      - name: Execute Demo.ipynb unchanged (+ export cell)
        run: python run_demo.py
      - name: Upload output whatever validation says, for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-output
          path: |
            pyconnectedness-explorer/app/public/data/
            pyconnectedness-explorer/pipeline/out/
      - name: Validate against the numbers the notebook itself printed
        id: validate
        continue-on-error: true
        run: python validate.py
      - name: Build the other datasets from their public APIs (each independent)
        continue-on-error: true
        run: python run_datasets.py
      - name: Commit the data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "stock data failed validation: keeping its last good build"
            git checkout -- pyconnectedness-explorer/app/public/data/connectedness.json \
              pyconnectedness-explorer/app/public/data/pairwise_returns.f32 \
              pyconnectedness-explorer/app/public/data/pairwise_volatility.f32 \
              pyconnectedness-explorer/app/public/data/raw_snapshot.csv.gz \
              pyconnectedness-explorer/pipeline/out/reference
          fi
          git add pyconnectedness-explorer/app/public/data pyconnectedness-explorer/pipeline/out/reference
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Data: Demo.ipynb (pinned 4cc953f) on Yahoo Finance, plus the public-API datasets"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
